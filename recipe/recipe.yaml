context:
  version: "0.0.13"

package:
  name: iamb
  version: ${{ version }}

source:
  url: https://github.com/ulyssa/iamb/archive/refs/tags/v${{ version }}.tar.gz
  sha256: a87b81d4cd60f72725b5b633c78ecb28fccc457f6319037fa9d12096fd6e3ef1

build:
  number: 0
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      # build.rs uses vergen-gitcl; the source tarball isn't a git worktree so
      # the override is needed, otherwise `env!("VERGEN_GIT_SHA")` fails to compile
      VERGEN_GIT_SHA: unknown
    content:
      - if: unix
        then:
          - cargo auditable install --locked --no-track --bins --root ${{ PREFIX }} --path .
        else:
          - cargo auditable install --locked --no-track --bins --root %LIBRARY_PREFIX% --path .
      - cargo-bundle-licenses --format yaml --output ./THIRDPARTY.yml

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable

tests:
  - script: iamb --help
  - package_contents:
      bin:
        - iamb
      strict: true

about:
  homepage: https://iamb.chat
  summary: A Matrix client for Vim addicts
  description: |
    iamb is a Matrix client for the terminal that uses Vim keybindings.
    It supports threads, spaces, E2EE, image previews, notifications,
    read receipts, and more.
  license: Apache-2.0
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  documentation: https://iamb.chat
  repository: https://github.com/ulyssa/iamb

extra:
  recipe-maintainers:
    - pavelzw
